<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Tag</title>
</head>
<body>
    <p>Italy is a boot-shaped peninsula.This is normal text.</p>
    <strong>Italy is a boot-shaped peninsula. With strong tag. Strong tag makes text bold.</strong>
    <p>Italy is a <strong>boot-shaped peninsula.</strong>This strong tag in combination with paragraph tag.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indentation and Nesting</title>
</head>
<body>
    <p>Since the rise of Roman Empire, Italian art, architecture, and culture have had an influence around the world.</p>
    <p>Famed Italian painter include Leonardo da Vinci and Michelangelo.</p>
    <!-- Here <body> tag is parent tag. -->
    <!-- Both <p> tags are child tags to <body> tag.-->
    <p>Each paragraph is <strong>sibling</strong> to each other. </p> 
    <!-- <p> is parent tag and <strong> is child tag for this. -->       
</body>
</html>

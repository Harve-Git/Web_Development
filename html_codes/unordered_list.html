<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Unordered List</title>
    </head>
    <body>
        <p>This is an example of Unordered List.</p>
        <!-- Unordred List -->
        <ul>
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ul>
        <p>This is an example of Nested Unordered List.</p>
        <!-- Unordered List-->
        <ul>
            <li>Humus Pasta</li>
            <!-- Unordered List-->
            <ul>
                <li>Humus</li>
                <li>Pasta</li>
            </ul>
            <li>Sweet Potato Spinach Hash</li>
            <!-- Ordered List-->
            <ol>
                <li>Sweet Potato</li>
                <li>Spinach</li>
                <li>Eggs</li>
            </ol>
        </ul>
    </body>
</html>

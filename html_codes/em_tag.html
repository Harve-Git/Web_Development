<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Em Tag</title>
    </head>
    <body>
        <p>Italy is a boot-shaped peninsula. This is normal text.</p>
        <em>Italy is a boot-shaped peninsula. With em tag. Em tag makes text Italic.</em>
        <p>Italy is a <em>boot-shaped peninsula.</em>Em tag can be used in combination with paragraph tag.</p>
    </body>
</html>
